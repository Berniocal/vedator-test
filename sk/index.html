<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#162033;--muted:#64748b;--line:#dbe2ea;--accent:#5b4bdb;--accent2:#ede9fe}

header{background:linear-gradient(135deg,#151b2f,#32256c);color:#fff;padding:28px 18px 24px}.wrap{max-width:1050px;margin:auto}.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.install-app{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;white-space:nowrap}.install-app:hover{background:rgba(255,255,255,.22)}.install-app.hidden{display:none!important}

<script>
const TOPICS={'Všetko':[],'FAQ':['faq','Dobre, dobre, dobre, dobre, dobre, dobre, dobre.'],'Mimozemský život':['mimozem','astrobiolog','exoplanet','civiliz','biosignat'],'Kosmologie':['kozmolog','kosmolog','Veľké trpaslíky','rozpin','casopriestor'],'Temná energie':['Temná energia','Temná energia','dark energy'],'Čierne diery':['černá diera','černá peria','cierne diery','černá diry','čierny otvor'],'Kvantová fyzika':['kvant','superpoz','previazan','provazan'],'Relativita':['relativit','dilatacia času','rýchlosť svetla'],'Astronomie':['hviezd','hvezd','planet','galaxi','teleskop','slnko','slunce','mesiac','mesic','mars','jupiter'],'Biologie a medicína':['bunk','mozog','mozek','gen','evol','virus','bakter','sperm','vajic','alzheimer','dopamin'],'Matematika':['matemat','geometri','fraktal','nekonec','chaos','pravdepodob'],'Technologie a AI':['umelý intelekt','umelý intelekt','internet','pocitac','robot','algoritm'],'Země a příroda':['zemetrasen','sopk','tornad','hurikan','klima','ocean','geolog'],'Chemie a materiály':['chem','molekul','atom','prvok','prvek','helium','material'],'Společnost a psychologie':['sociálne siete','sociálny web','psychol','spolocnost','spolecnost','moral','radikaliz','ekonom','peniaz','penez']};
const QUERY_EQUIV=[['černá peria','černá diera'],['černá diry','cierne diery'],['černých derov','Dvojčata'],['Temná energia','Temná energia'],['Temný materiál','tmavý materiál'],['umelý intelekt','umelý intelekt'],['slunce','slnko'],['mesic','mesiac'],['hvezda','hviezda'],['hvezdy','hviezdy'],['mozek','mozog'],['Život vo vesmíre','Život vo vesmíre'],['casoprostor','casopriestor'],['spolecnost','spolocnost'],['sociálny web','sociálne siete'],['penize','peniaze']];
const SCIENTIST_EPISODES={men:[18,66,77,92,97,107,188,206,207,230,324],women:[320,305,302,288,222,220,205,199,140,85,70,53]};
const MATHEMATICS_EPISODES=new Set([91,93,98,113,115,116,117,118,156,181,198,201,216,249,282,286,328,329,336]);
const VEDATOR_SPECIAL_TITLES=new Set([
'Vedatorsky špeciálny udržateľnosť príkazu štúdia IKEA',
'Vedatorsky špeciálny prečo je v nealko piva alkohol',
'Vedatorsky špeciálny astrológiu',
'Vodičské špeciálne prenos signálu vzduchom',
'Vedatory špeciálne obyčajné pohľady ukazovanie z knihy',
'Vedatérsky špeciálny vďak komsu sú jadrové elektrárne bezpečné',
'Vedcovské špeciálne zelené energie',
'Vedatorsky špeciálny kus reality',
'vedatorsky special ako znie vesmir',
'Vedátorsky špeciálny dungeon vedátor'
]);
const FIXED_SERIES=[
{name:'Hľadanie mimozemského života',test:e=>norm(e.title).includes('Hladovanie mimozemského života')},
{name:'FAQ  dobré otázky',test:e=>/\bfaq\b/i.test(e.title)||[138,300].includes(Number(e.number))},
{name:'Rozhovory o vesmíre',test:e=>norm(e.title).includes('Rozhovory o vesmíre')},
{name:'Žijem v poriadku',test:e=>norm(e.title).includes('V zimnom čase')},
{name:'Genetický špeciál',test:e=>norm(e.title).includes('geneticky špeciálne')},
{name:'Nobelovci',test:e=>{const n=norm(e.title);return(n.includes('Nobelovca cena')&&!n.includes('Ig Nobelov'))||Number(e.number)===152}},
{name:'Ig Nobelovca',test:e=>norm(e.title).includes('Ig Nobelovca')},
{name:'Matematika',test:e=>MATHEMATICS_EPISODES.has(Number(e.number))},
{name:'Teória hier',test:e=>[29,105,120,245,254].includes(Number(e.number))},
{name:'Rozhovory v angličtine',test:e=>[234,236,238,240,242,246,250,256,265,267].includes(Number(e.number))},
{name:'Internet',test:e=>[223,258,333].includes(Number(e.number))},
{name:'Vedátorský špeciál',test:e=>VEDATOR_SPECIAL_TITLES.has(norm(e.title))},
{name:'Čierne diery',test:e=>[296,227,173,132,104,68].includes(Number(e.number))},
{name:'Temná hmotnosť a energia',test:e=>[210,182,145,48,2].includes(Number(e.number))},
{name:'Častice',test:e=>[10,34,163,175,180,187,225].includes(Number(e.number))},
{name:'Roky v vede',test:e=>[108,160,212,318].includes(Number(e.number))}
];
const SUMMARIES={300:{sections:[
{time:'1:29',title:'1) Ako by sme mohli komunikovať s mimozemskou civilizáciou?',items:['Najväčší problém je, že nevieme, či nás budú považovať za partnerov alebo formátov.','Môžu nás zneškodniť bez toho, aby sme premýšľali, rovnako ako človek zabíja baktérie.','Ak sú dostatočne vyspelé na cestovanie vesmírom, musia mať vyspelú etiku, inak by sa sami zničili.','Komunikácia by začala tým, že by ukazovala na objekty (kamen → kamen).','Dúfajú, že bude existovať spoločná logika jazyka, hoci nie slovný zástroj.','Niektoré pozemské jazyky nemajú minulosť/budúcu dobu, alebo recyklácia  mimozemské jazyky môžu byť ešte odlišnejšie.','Možno nás už sledujú mimozemšťania, ale my nedokážeme rozpoznať ich signály.']},
{time:'6:33',title:'2) Existujú farebné galaxie?',items:['Vzdálené galaxie vypadají červeně kvůli červenému posuvu.','Mladé vesmír → galaxie boli modré (mladé hviezdy).','Dnes jsou spíše do červena.','V blízkosti galaxií nemajú jednu farbu, pretože sú zmiešaním mnohých hviezd.','Existujú aj rádioaktivné galaxie (silný rádio signál).']},
{time:'8:14',title:'3) Vedeli by sme vôbec rozpoznať mimozemskú civilizáciu, ak by fungovala úplne inak?',items:['Je možné, že mimozemšťania vôbec nepoznali.','Mohli by byť tak technologicky nad nami, že ich signály by boli neviditeľné ako iPhone pre mravce.','Možno sme obklopení signálmi, ktoré nemôžeme rozpoznať.','Porovnanie: domorodý kmeň bez rádia → netuší, že okolo neho lietajú rádiové vlny.','Gravitatívne vlny sú príkladom: vždy existovali, ale až nedávno sme ich mohli merať.']},
{time:'10:42',title:'4) Prečo sa svetlo vo vákuu šíri inak ako v skle/vode/atmosfére? Zrýchli, keď vyjde von?',items:['Rýchlo nie je správne slovo V vakuu svetlo vždy má rovnakú rýchlosť.','V materiáli sa vplyvuje na hmotnosť, čo spôsobuje účinné spomalenie.','Fotony mezi interakcemi stále letí rychlostí světla.','Vysvetľujú to pomocou analógie a hovoria, že optická látka je ťažká bez rovnic.']},
{time:'13:02',title:'5) Čo je vlastne veľký tresk? Je to singularita? Alebo stav, keď sa nemohlo šíriť svetlo?',items:['Světlo se nemohlo šířit až 360 000 let po velkém třesku, takže to není definice samotného třesku.','Neexistuje úplný súhlas o tom, čo sa presne stalo.','Existuje mnoho modelov: vesmír sa zmenšil a odrástol, bol zapnutý a potom sa rozpadol, alebo vznikol spolu s časom.','Zmiňují knihu Before the Big Bang a podcast Seana Carrolla.','Budoucí detektor LISA může přinést zásadní poznatky o raném vesmíru.']},
{time:'19:12',title:'6) Aké zákony by ste nahradili/reguľovali AI?',items:['Právník v publiku: AI by měla mít kill switch.','Problém: tréning na ukradnuté obsah.','Problém: osobné údaje v tréningových dátách.','Veľká regulácia môže brániť inováciám → Čína by mohla získať pokrok.','Možno by výrobca mal byť zodpovedný za škody spôsobené AI.','Diskuse o autonomních autech a odpovědnosti.','Vravia, že AI vylúčila Google kód cez príbeh o babičke.']},
{time:'24:09',title:'7) Prečo majú niektoré objekty vysokú excentricitu? Prečo medzi Marsom a Jupiterom nevznikla planéta?',items:['Dva hlavní důvody:','1) Zlápkové sily  blízkych objektov sú narušené.','2) Nestabilita slnečnej sústavy  bola kedysi chaotická, planéty sa zmenili.','Dve obdobia ťažkých bombardovaní.','Gravitační praky mohou měnit dráhy i bez srážek.','Možno existujú bláznivé planéty, ktoré sú vystreľované gravitačnou interakciou.','Materiálu mezi Marsem a Jupiterem je málo a je rušen Jupiterem.']},
{time:'29:53',title:'8) Aké technológie môžu pomôcť odvrátiť klimatickú krízu?',items:['Tóriové reaktory.','Získanie uhlíka (Švajčiarsko).','Problém: musí byť pohánený zelenou energiou, inak to nemá zmysel.','Solární panely s vyšší efektivitou by byly revoluční.','Je potrebné zmeniť výrobu cementu, ocele.','AI může optimalizovat plýtvání energií a potravinami.','Stromy vážou CO₂ do půdy.','Geoengineering je riskantné.']},
{time:'36:32',title:'9) Ako vznikli Saturnove prstence? Kedy zaniknú?',items:['Nevíme přesně.','Prste sú dynamické, nestabilné.','Jsou trhané slapovými silami.','Nedávne štúdie naznačujú, že zmiznú, ale časové horizonty si nepamätajú.']},
{time:'39:07',title:'10) Zmenia sa hviezdy v budúcnosti?',items:['Áno, hviezdy sa pohybujú.','ESA má simulaci pohybu hvězd na 500 000 let dopředu.','Súhvězdia sa deformujú (napr. Veľká vozidlo).','Egypťania používali iný "sever" pre preces.','Severný pól sa posúva. Niektoré letiská museli presmerovať trasy.','Andromeda sa blíži k nám, ale jeho laterálna rýchlosť nie je známa.']},
{time:'41:46',title:'11) Kedy budú ďalšie rozhovory o vesmíre s Norbym?',items:['Josef už nebude pracovať na Masaryčce, ale rozhovory budú pokračovať.','Mají rozpracovanou druhou knihu.','Majú 3⁄44 neporušené epizódy.','Do konce roku chtějí vydat alespoň jednu nebo dvě.']}
]}};
let episodes=[],active='Všetko',view='episodes';
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const cleanHtml=s=>{const d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim()};
const short=s=>{s=cleanHtml(s).replace(/Podcast vzniká[\s\S]*/i,'').trim();return s.length>440?s.slice(0,437).replace(/\s+\S*$/,'')+'…':s};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function expandedQuery(q){const base=norm(q);if(!base)return[];const out=new Set([base]);for(let pass=0;pass<3;pass++)for(const current of [...out])for(const group of QUERY_EQUIV)for(const source of group){const src=norm(source);const re=new RegExp('(Súhlasné)'+src.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s tým$)','g');if(re.test(current))for(const target of group)out.add(current.replace(re,(m,p)=>p+norm(target)))}return[...out]}
function matchLevel(ep,queries){if(!queries.length)return 0;const title=norm(ep.title),desc=norm(cleanHtml(ep.description));if(queries.some(q=>title.includes(q)))return 0;if(queries.some(q=>q.split(' ').every(w=>title.includes(w))))return 1;if(queries.some(q=>desc.includes(q)))return 2;if(queries.some(q=>q.split(' ').every(w=>desc.includes(w))))return 3;return 99}
function selectedTopicQueries(){return active==='Všetko'?[]:[...new Set((TOPICS[active]||[]).flatMap(expandedQuery))]}
function categories(ep){const txt=norm(ep.title+' '+cleanHtml(ep.description));const result=Object.entries(TOPICS).filter(([k,w])=>k!=='Všetko'&&w.some(x=>txt.includes(norm(x)))).map(x=>x[0]);if(MATHEMATICS_EPISODES.has(Number(ep.number))&&!result.includes('Matematika'))result.push('Matematika');return result}
function summaryHtml(number){const s=SUMMARIES[number];if(!s)return'';return `<details class="episode-summary"><summary>Zhrnutie diely</summary><div class="episode-summary-body">${s.sections.map(x=>`<div class="summary-block"><div class="summary-time">${esc(x.time)}</div><div class="summary-title">${esc(x.title)}</div><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}<div class="summary-note">Shrnutí vychází z časových kapitol vytvořených pro video.</div></div></details>`}
async function load(){document.querySelector('#count').textContent='Čítam katalóg...';try{const r=await fetch('./episodes.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();episodes=Array.isArray(data)?data:data.episodes;if(!Array.isArray(episodes)||!episodes.length)throw Error('Katalog je prázdny.');localStorage.setItem('vedatorEpisodes',JSON.stringify(episodes));render()}catch(e){const saved=localStorage.getItem('vedatorEpisodes');if(saved){episodes=JSON.parse(saved);render()}else{document.querySelector('#episodes').innerHTML='<div class="status"><strong>Katalog se nepodařilo načíst.</strong><br>'+esc(e.message)+'</div>';document.querySelector('#count').textContent='Bez údajov'}}}
function renderTopics(){const el=document.querySelector('#topics');el.innerHTML='';Object.keys(TOPICS).forEach(t=>{const b=document.createElement('button');b.className='topic'+(t===active?' active':'');b.textContent=t;b.onclick=()=>{active=t;render()};el.appendChild(b)})}
function filtered(){const queries=expandedQuery(document.querySelector('#search').value),topics=selectedTopicQueries();return episodes.map(e=>{const searchMatch=matchLevel(e,queries),topicMatch=matchLevel(e,topics);return{...e,cats:categories(e),searchMatch,topicMatch}}).filter(e=>(!queries.length||e.searchMatch<99)&&(active==='Matematika'?MATHEMATICS_EPISODES.has(Number(e.number)):(!topics.length||e.topicMatch<99)))}
function renderEpisodes(){let arr=filtered(),queries=expandedQuery(document.querySelector('#search').value),topics=selectedTopicQueries();const sort=document.querySelector('#episodeSort').value;arr.sort((a,b)=>{if(topics.length&&a.topicMatch!==b.topicMatch)return a.topicMatch-b.topicMatch;if(queries.length&&a.searchMatch!==b.searchMatch)return a.searchMatch-b.searchMatch;return sort==='old'?new Date(a.date)-new Date(b.date):sort==='number'?(b.number||0)-(a.number||0):new Date(b.date)-new Date(a.date)});document.querySelector('#count').textContent=`Našli sme ho .${arr.length} z ${episodes.length} epizod`;const box=document.querySelector('#episodes');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="status">Nic jsem nenašel.</div>';return}arr.forEach(e=>{const a=document.createElement('article');const dt=e.date?new Intl.DateTimeFormat('sk-SK',{day:'numeric',month:'long',year:'numeric'}).format(new Date(e.date)):'';a.innerHTML=`<div class="date">${esc(dt)}</div><h2>${esc(e.title)}</h2><div class="desc">${esc(short(e.description)||'Popis není k dispozici.')}</div><div class="tags">${(e.cats.length?e.cats:['Ostatné']).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="links">${e.enclosure?`<a class="primary" href="${esc(e.enclosure)}"Target="_blank" rel="noopener">Predhrávať</a>`:''}<a class="secondary" href="${esc(e.link||e.enclosure)}"Detail"</a></div>${summaryHtml(Number(e.number))}`;box.appendChild(a)})}
function peopleByNumbers(numbers){return numbers.map(n=>episodes.find(e=>Number(e.number)===n)).filter(Boolean).map(e=>({...e,person:e.title.replace(/^Vedátorský podcast\s*\d+\s*[–—-]?\s*/i,'').trim()})).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function firstDate(g){return Math.min(...g.items.map(e=>new Date(e.date).getTime()).filter(Number.isFinite))}
function seriesGroups(){const groups=[];for(const s of FIXED_SERIES){const items=episodes.filter(s.test).sort((a,b)=>new Date(a.date)-new Date(b.date));if(items.length>=2)groups.push({name:s.name,items})}const men=peopleByNumbers(SCIENTIST_EPISODES.men);if(men.length)groups.push({name:'Vedci',items:men,people:true});const women=peopleByNumbers(SCIENTIST_EPISODES.women);if(women.length)groups.push({name:'Vedci',items:women,people:true});const automatic={};episodes.forEach(e=>{let core=norm(e.title.replace(/^Vedátorský podcast\s*\d+\s*[–—-]?\s*/i,'').replace(/\b(?:i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii|\d+)\b\s*$/i,''));if(core==='Najväčší boj v matematike')return;if(core.length>8)(automatic[core]??=[]).push(e)});for(const items0 of Object.values(automatic)){if(items0.length<2)continue;const ids=new Set(groups.flatMap(g=>g.items.map(e=>e.id||e.link||e.title)));const items=items0.filter(e=>!ids.has(e.id||e.link||e.title));if(items.length>=2)groups.push({name:items[0].title.replace(/^Vedátorský podcast\s*\d+\s*[–—-]?\s*/i,'').replace(/\s+(?:I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII|\d+)\s*$/i,''),items:items.sort((a,b)=>new Date(a.date)-new Date(b.date))})}const mode=document.querySelector('#seriesSort').value;groups.sort((a,b)=>mode==='alpha'?a.name.localeCompare(b.name,'sk'):mode==='first'?firstDate(a)-firstDate(b):b.items.length-a.items.length||a.name.localeCompare(b.name,'sk'));return groups}
function renderSeries(){const groups=seriesGroups();document.querySelector('#count').textContent=`Našli sme ho .${groups.length} sérií`;document.querySelector('#series').innerHTML=groups.map(g=>`<details class="series-card"><summary><span>${esc(g.name)}</span><span class="series-count">${g.items.length} dílů</span></summary><div class="series-body"><ol>${g.items.map(e=>`<li><a href="${esc(e.link||e.enclosure)}"Target="_blank" rel="noopener">${g.people?`<span class="person-name">${esc(e.person)}</span><span class="episode-title">${esc(e.title)}</span>`:esc(e.title)}</a></li>`).join('')}</ol></div></details>`).join('')}
function render(){renderTopics();document.querySelector('#episodes').classList.toggle('hidden',view!=='episodes');document.querySelector('#series').classList.toggle('hidden',view!=='series');document.querySelector('#episodeSort').classList.toggle('hidden',view!=='episodes');document.querySelector('#seriesSort').classList.toggle('hidden',view!=='series');view==='episodes'?renderEpisodes():renderSeries()}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#episodeSort').addEventListener('change',render);document.querySelector('#seriesSort').addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',load);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
const installButton=document.querySelector('#installApp');
let deferredInstallPrompt=null;
const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function updateInstallButton(){installButton.classList.toggle('hidden',isInstalled())}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallButton()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.classList.add('hidden')});
installButton.addEventListener('click',async()=>{if(isInstalled()){installButton.classList.add('hidden');return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;updateInstallButton();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);alert(ios?'V Safari klepněte na Sdílet a potom na Přidat na plochu.':'Instalaci otevřete v nabídce prohlížeče a zvolte Instalovat aplikaci nebo Přidat na plochu.')});
updateInstallButton();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();
</script>
