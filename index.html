<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Vedátorský podcast – podľa tém</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap header-row">
    <div>
      <div class="eyebrow" data-i18n="catalogEyebrow"></div>
      <h1 data-i18n="appTitle"></h1>
    </div>
    <div class="header-actions">
      <div class="language-switch" role="group" data-i18n-aria="languageSwitch">
        <button type="button" data-language="sk">SK</button>
        <button type="button" data-language="cs">CZ</button>
      </div>
      <button id="installApp" class="install-app" type="button" data-i18n="install"></button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="panel controls-panel">
    <div class="controls">
      <input id="search" class="search" type="search" autocomplete="off">
      <button id="refresh" class="refresh" type="button" data-i18n="reload"></button>
    </div>
    <div id="tabs" class="tabs" role="tablist">
      <button class="tab active" type="button" data-view="episodes" data-i18n="episodes"></button>
      <button class="tab" type="button" data-view="series" data-i18n="series"></button>
      <button class="tab" type="button" data-view="questions" data-i18n="questions"></button>
    </div>
    <div id="topics" class="topics"></div>
  </section>
  <div class="meta">
    <div id="count" aria-live="polite"></div>
    <select id="sort" class="sort"></select>
  </div>
  <section id="content" class="grid" aria-live="polite"></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
