<!doctype html>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.bar{position:fixed;z-index:2147483647;top:10px;right:12px;display:flex;gap:4px;padding:4px;background:rgba(17,24,39,.94);border:1px solid rgba(255,255,255,.28);border-radius:12px;box-shadow:0 4px 18px #0006}.bar button{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}.bar button.active{background:#fff;color:#241b58}.bar button:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}iframe{display:block;width:100%;height:100%;border:0;background:#f4f6fb}.error{display:none;color:white;padding:80px 24px;text-align:center}.error a{color:#a99df6}
</style>
</head>
<body>
<div class="bar" id="languageSwitch" aria-label="Jazyk"><button data-lang="sk" type="button">SK</button><button data-lang="cs" type="button">CZ</button></div>
<iframe id="app" src="../vedator/" title="Vedátorský podcast"></iframe>
<div id="error" class="error">Aplikáciu sa nepodarilo načítať. <a href="../vedator/">Otvoriť pôvodnú verziu</a></div>
<script>
(()=>{
const KEY='vedator-language-v2',frame=document.getElementById('app');let lang=localStorage.getItem(KEY)==='cs'?'cs':'sk',observer,queued=false,applying=false;
const P=[
['Neoficiální tematický katalog','Neoficiálny tematický katalóg'],['Vedátorský podcast podle témat','Vedátorský podcast podľa tém'],['Instalovat','Inštalovať'],['Znovu načíst','Znova načítať'],['Epizody','Epizódy'],['Série','Série'],['Otázky','Otázky'],['Playlisty','Playlisty'],['Načítám epizody…','Načítavam epizódy…'],['Načítám katalog…','Načítavam katalóg…'],['Načítání…','Načítavanie…'],['Nejnovější','Najnovšie'],['Nejstarší','Najstaršie'],['Podle čísla dílu','Podľa čísla dielu'],['Podle počtu dílů','Podľa počtu dielov'],['Podle abecedy','Podľa abecedy'],['Podle stáří prvního dílu','Podľa veku prvého dielu'],
['Vše','Všetko'],['Vesmír','Vesmír'],['Mimozemský život','Mimozemský život'],['Kosmologie','Kozmológia'],['Temná energie','Tmavá energia'],['Černé díry','Čierne diery'],['Kvantová fyzika','Kvantová fyzika'],['Relativita','Relativita'],['Relativita a gravitace','Relativita a gravitácia'],['Astronomie','Astronómia'],['Biologie a medicína','Biológia a medicína'],['Matematika','Matematika'],['Technologie','Technológie'],['Technologie a AI','Technológie a AI'],['Země a příroda','Zem a príroda'],['Chemie','Chémia'],['Chemie a materiály','Chémia a materiály'],['Společnost a psychologie','Spoločnosť a psychológia'],['Ostatní','Ostatné'],
['Hledání mimozemského života','Hľadanie mimozemského života'],['Hľadanie mimozemského života','Hľadanie mimozemského života'],['FAQ – dobré otázky','FAQ – dobré otázky'],['Rozhovory o vesmíru','Rozhovory o vesmíre'],['Rozhovory o vesmíre','Rozhovory o vesmíre'],['Žiji vědu','Žijem vedu'],['Žijem vedu','Žijem vedu'],['Genetický speciál','Genetický špeciál'],['Genetický špeciál','Genetický špeciál'],['Nobelovy ceny','Nobelove ceny'],['Ig Nobelovy ceny','Ig Nobelove ceny'],['Teorie her','Teória hier'],['Rozhovory v angličtině','Rozhovory v angličtine'],['Rozhovory v angličtine','Rozhovory v angličtine'],['Internet','Internet'],['Vedátorský speciál','Vedátorský špeciál'],['Vedátorský špeciál','Vedátorský špeciál'],['Temná hmota a energie','Tmavá hmota a energia'],['Tmavá hmota a energie','Tmavá hmota a energia'],['Částice','Častice'],['Roky ve vědě','Roky vo vede'],
['Přehrát','Prehrať'],['Pozastavit','Pozastaviť'],['Pokračovat','Pokračovať'],['Předchozí','Predchádzajúci'],['Další','Ďalší'],['Předchozí otázka','Predchádzajúca otázka'],['Další otázka','Ďalšia otázka'],['Předchozí díl','Predchádzajúci diel'],['Další díl','Ďalší diel'],['O 10 sekund zpět','O 10 sekúnd späť'],['O 10 sekund dopředu','O 10 sekúnd dopredu'],['Rychlost','Rýchlosť'],['Stáhnout','Stiahnuť'],['Stáhnout audio','Stiahnuť audio'],['Číst více','Čítať viac'],['Číst méně','Čítať menej'],['Zobrazit více','Zobraziť viac'],['Zobrazit méně','Zobraziť menej'],['Zpět nahoru','Späť hore'],['Zavřít','Zavrieť'],['Otevřít','Otvoriť'],
['Moje playlisty','Moje playlisty'],['Nový playlist','Nový playlist'],['Vytvořit playlist','Vytvoriť playlist'],['Přidat do playlistu','Pridať do playlistu'],['Odebrat z playlistu','Odobrať z playlistu'],['Přejmenovat','Premenovať'],['Smazat','Odstrániť'],['Playlist je prázdný.','Playlist je prázdny.'],['Zatím tu nic není.','Zatiaľ tu nič nie je.'],['Žádné výsledky','Žiadne výsledky'],['Nebyly nalezeny žádné epizody.','Nenašli sa žiadne epizódy.'],['Nebyly nalezeny žádné otázky.','Nenašli sa žiadne otázky.'],['Chyba při načítání','Chyba pri načítaní'],['Zkusit znovu','Skúsiť znova'],
['Díl','Diel'],['Podcast','Podcast'],['Souhrn epizody','Súhrn epizódy'],['Obsah epizody','Obsah epizódy'],['Zdroj','Zdroj'],['Oficiální web','Oficiálny web'],['Poslechnout','Vypočuť'],['Otevřít epizodu','Otvoriť epizódu'],['Přejít na podcast','Prejsť na podcast'],['Tmavý režim','Tmavý režim'],['Světlý režim','Svetlý režim'],['Přepnout motiv','Prepnúť motív'],['Výchozí zobrazení','Predvolené zobrazenie'],['Karty','Karty'],['Seznam','Zoznam']
];
const MAP=new Map();for(const [cs,sk] of P){MAP.set(cs,{cs,sk});MAP.set(sk,{cs,sk})}
const ATTR=[
['Hledat česky nebo slovensky: černé/čierne díry, vesmír…','Hľadať po česky alebo slovensky: černé/čierne diery, vesmír…'],['Hledat v otázkách…','Hľadať v otázkach…'],['Hledat playlist…','Hľadať playlist…'],['Název playlistu','Názov playlistu'],['Jazyk','Jazyk']
];
const AM=new Map();for(const [cs,sk] of ATTR){AM.set(cs,{cs,sk});AM.set(sk,{cs,sk})}
function target(pair){return pair[lang]}
function countText(s){
 let x=s;
 const rules=lang==='sk'?[[/\b(\d+)\s+epizod\b/gi,'$1 epizód'],[/\b(\d+)\s+dílů\b/gi,'$1 dielov'],[/\b(\d+)\s+díly\b/gi,'$1 diely'],[/\b(\d+)\s+díl\b/gi,'$1 diel'],[/\b(\d+)\s+otázek\b/gi,'$1 otázok'],[/\b(\d+)\s+otázky\b/gi,'$1 otázky'],[/\b(\d+)\s+otázka\b/gi,'$1 otázka'],[/\b(\d+)\s+sérií\b/gi,'$1 sérií'],[/\b(\d+)\s+série\b/gi,'$1 série']]:[[/\b(\d+)\s+epizód\b/gi,'$1 epizod'],[/\b(\d+)\s+dielov\b/gi,'$1 dílů'],[/\b(\d+)\s+diely\b/gi,'$1 díly'],[/\b(\d+)\s+diel\b/gi,'$1 díl'],[/\b(\d+)\s+otázok\b/gi,'$1 otázek'],[/\b(\d+)\s+otázky\b/gi,'$1 otázky'],[/\b(\d+)\s+otázka\b/gi,'$1 otázka']];
 for(const [r,v] of rules)x=x.replace(r,v);return x
}
function textValue(raw){const lead=raw.match(/^\s*/)?.[0]||'',trail=raw.match(/\s*$/)?.[0]||'',t=raw.trim();if(!t)return raw;const p=MAP.get(t);if(p)return lead+target(p)+trail;const counted=countText(t);return counted!==t?lead+counted+trail:raw}
function translateElement(el){
 if(!el||el.nodeType!==1)return;
 for(const a of ['placeholder','aria-label','title']){const v=el.getAttribute(a);if(!v)continue;const p=AM.get(v)||MAP.get(v);if(p)el.setAttribute(a,target(p));else{const c=countText(v);if(c!==v)el.setAttribute(a,c)}}
 if(el.tagName==='INPUT'&&['button','submit','reset'].includes(el.type)){const p=MAP.get(el.value);if(p)el.value=target(p)}
}
function apply(doc){
 if(applying||!doc?.body)return;applying=true;
 doc.documentElement.lang=lang;doc.title=lang==='sk'?'Vedátorský podcast – podľa tém':'Vedátorský podcast – podle témat';
 const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(['SCRIPT','STYLE','TEXTAREA','CODE','PRE'].includes(n.parentElement?.tagName))continue;const v=textValue(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
 doc.querySelectorAll('[placeholder],[aria-label],[title],input[type="button"],input[type="submit"],input[type="reset"]').forEach(translateElement);
 const search=doc.getElementById('search');if(search)search.placeholder=lang==='sk'?'Hľadať po česky alebo slovensky: černé/čierne diery, vesmír…':'Hledat česky nebo slovensky: černé/čierne díry, vesmír…';
 applying=false
}
function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;try{observer?.disconnect();apply(frame.contentDocument);observer?.observe(frame.contentDocument.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']})}catch{}})}
function setLanguage(next){lang=next==='cs'?'cs':'sk';localStorage.setItem(KEY,lang);document.documentElement.lang=lang;document.title=lang==='sk'?'Vedátorský podcast – podľa tém':'Vedátorský podcast – podle témat';document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});schedule()}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
frame.addEventListener('load',()=>{try{apply(frame.contentDocument);observer?.disconnect();observer=new MutationObserver(schedule);observer.observe(frame.contentDocument.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});setTimeout(schedule,500);setTimeout(schedule,1600)}catch{document.getElementById('error').style.display='block'}});
setLanguage(lang);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
