<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Vedátorský podcast – podľa tém</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.bar{position:fixed;z-index:20;top:10px;right:12px;display:flex;gap:4px;padding:4px;background:rgba(17,24,39,.9);border:1px solid rgba(255,255,255,.25);border-radius:12px;box-shadow:0 4px 18px #0005}.bar button{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#fff;font-weight:800;cursor:pointer}.bar button.active{background:#fff;color:#241b58}iframe{display:block;width:100%;height:100%;border:0;background:#f4f6fb}.error{display:none;color:white;padding:80px 24px;text-align:center}.error a{color:#a99df6}
</style>
</head>
<body>
<div class="bar" id="languageSwitch" aria-label="Jazyk"><button data-lang="sk">SK</button><button data-lang="cs">CZ</button></div>
<iframe id="app" src="../vedator/" title="Vedátorský podcast"></iframe>
<div id="error" class="error">Aplikáciu sa nepodarilo načítať. <a href="../vedator/">Otvoriť pôvodnú verziu</a></div>
<script>
(()=>{const KEY='vedator-language',frame=document.getElementById('app');let lang=localStorage.getItem(KEY)==='cs'?'cs':'sk',busy=false,observer;
const exact={
'Neoficiální tematický katalog':['Neoficiálny tematický katalóg','Neoficiální tematický katalog'],'Vedátorský podcast podle témat':['Vedátorský podcast podľa tém','Vedátorský podcast podle témat'],'Instalovat':['Inštalovať','Instalovat'],'Znovu načíst':['Znova načítať','Znovu načíst'],'Epizody':['Epizódy','Epizody'],'Série':['Série','Série'],'Načítám epizody…':['Načítavam epizódy…','Načítám epizody…'],'Načítám katalog…':['Načítavam katalóg…','Načítám katalog…'],'Nejnovější':['Najnovšie','Nejnovější'],'Nejstarší':['Najstaršie','Nejstarší'],'Podle čísla dílu':['Podľa čísla dielu','Podle čísla dílu'],'Podle počtu dílů':['Podľa počtu dielov','Podle počtu dílů'],'Podle abecedy':['Podľa abecedy','Podle abecedy'],'Podle stáří prvního dílu':['Podľa veku prvého dielu','Podle stáří prvního dílu'],'Vše':['Všetko','Vše'],'Kosmologie':['Kozmológia','Kosmologie'],'Temná energie':['Tmavá energia','Temná energie'],'Černé díry':['Čierne diery','Černé díry'],'Astronomie':['Astronómia','Astronomie'],'Biologie a medicína':['Biológia a medicína','Biologie a medicína'],'Technologie a AI':['Technológie a AI','Technologie a AI'],'Země a příroda':['Zem a príroda','Země a příroda'],'Chemie a materiály':['Chémia a materiály','Chemie a materiály'],'Společnost a psychologie':['Spoločnosť a psychológia','Společnost a psychologie'],'Hľadanie mimozemského života':['Hľadanie mimozemského života','Hledání mimozemského života'],'Rozhovory o vesmíre':['Rozhovory o vesmíre','Rozhovory o vesmíru'],'Žijem vedu':['Žijem vedu','Žiji vědu'],'Genetický speciál':['Genetický špeciál','Genetický speciál'],'Nobelovy ceny':['Nobelove ceny','Nobelovy ceny'],'Teorie her':['Teória hier','Teorie her'],'Rozhovory v angličtině':['Rozhovory v angličtine','Rozhovory v angličtině'],'Vedátorský špeciál':['Vedátorský špeciál','Vedátorský speciál'],'Tmavá hmota a energie':['Tmavá hmota a energia','Temná hmota a energie'],'Částice':['Častice','Částice'],'Roky ve vědě':['Roky vo vede','Roky ve vědě']};
const pairs=[['podle','podľa'],['témat','tém'],['černé','čierne'],['díry','diery'],['temná','tmavá'],['země','zem'],['příroda','príroda'],['společnost','spoločnosť'],['dílů','dielov'],['dílu','dielu'],['díl','diel'],['největší','najväčší'],['nevíme','nevieme'],['budou','budú'],['člověk','človek'],['vyspělí','vyspelí'],['vesmírem','vesmírom'],['kámen','kameň'],['některé','niektoré'],['odlišnější','odlišnejšie'],['možná','možno'],['schopni','schopní'],['rozpoznat','rozpoznať'],['vypadá','vyzerá'],['vypadají','vyzerajú'],['kvůli','pre'],['protože','pretože'],['který','ktorý'],['která','ktorá'],['které','ktoré'],['jsou','sú'],['není','nie je'],['může','môže'],['mohou','môžu'],['také','tiež'],['jen','iba'],['velmi','veľmi'],['více','viac'],['méně','menej']];
function exactTr(t){for(const [k,v] of Object.entries(exact))if(t===k||t===v[0]||t===v[1])return v[lang==='sk'?0:1];return null}
function convert(s){let out=s;for(const [cs,sk] of pairs){const a=lang==='sk'?cs:sk,b=lang==='sk'?sk:cs;out=out.replace(new RegExp('\\b'+a+'\\b','gi'),m=>m[0]===m[0].toUpperCase()?b[0].toUpperCase()+b.slice(1):b)}return out}
function translate(doc){if(busy)return;busy=true;doc.documentElement.lang=lang;doc.title=lang==='sk'?'Vedátorský podcast – podľa tém':'Vedátorský podcast – podle témat';const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(!n.nodeValue.trim()||['SCRIPT','STYLE','TEXTAREA'].includes(n.parentElement?.tagName))continue;if(!n.__original)n.__original=n.nodeValue;const trimmed=n.__original.trim(),e=exactTr(trimmed);n.nodeValue=e?n.__original.replace(trimmed,e):convert(n.__original)}const s=doc.getElementById('search');if(s)s.placeholder=lang==='sk'?'Hľadať po česky alebo slovensky: černé/čierne diery, vesmír…':'Hledat česky nebo slovensky: černé/čierne díry, vesmír…';busy=false}
function setLanguage(next){lang=next;localStorage.setItem(KEY,lang);document.documentElement.lang=lang;document.title=lang==='sk'?'Vedátorský podcast – podľa tém':'Vedátorský podcast – podle témat';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));try{translate(frame.contentDocument)}catch(e){}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));frame.addEventListener('load',()=>{try{translate(frame.contentDocument);observer?.disconnect();observer=new MutationObserver(()=>translate(frame.contentDocument));observer.observe(frame.contentDocument.body,{childList:true,subtree:true})}catch(e){document.getElementById('error').style.display='block'}});setLanguage(lang);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
