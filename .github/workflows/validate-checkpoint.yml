name: Repair and validate saved localization checkpoint

on:
  pull_request:
    branches: [main]
    paths:
      - tools/build_safe.py
      - tools/rebuild_from_memory.py
      - tools/validate_build_fixed.py
      - .generated-source-sha
      - .github/workflows/validate-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: vedator-checkpoint-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout translated checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Ignore temporary build files
        run: printf '/.source-vedator/\n__pycache__/\n*.py[cod]\n' >> .git/info/exclude

      - name: Checkout exact original application
        run: git clone --depth 1 https://github.com/Berniocal/vedator.git .source-vedator

      - name: Confirm checkpoint belongs to current source
        run: |
          expected=$(cat .generated-source-sha)
          actual=$(git -C .source-vedator rev-parse HEAD)
          echo "Saved source: $expected"
          echo "Current source: $actual"
          test "$expected" = "$actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight validation dependency
        run: python -m pip install beautifulsoup4

      - name: Check repair and validator syntax
        run: python -m py_compile tools/build_localized.py tools/build_fast.py tools/build_safe.py tools/rebuild_from_memory.py tools/validate_build.py tools/validate_build_fixed.py

      - name: Rebuild both languages from saved memory without translation model
        run: VEDATOR_LANGS=sk,cs python tools/rebuild_from_memory.py

      - name: Remove superseded prototype files
        run: |
          rm -f app.js core.js views.js player.js playlists.js styles.css
          rm -rf locales content

      - name: Validate exact copy, design, JavaScript, references, PWA and caches
        run: python tools/validate_build_fixed.py .source-vedator sk cs

      - name: Preserve verified files
        uses: actions/upload-artifact@v4
        with:
          name: vedator-verified-checkpoint-${{ github.run_id }}
          path: |
            sk
            cs
            translations/memory.json
            index.html
            sw.js
            manifest.webmanifest
            icon.svg
          if-no-files-found: error
          retention-days: 30

      - name: Commit repaired verified checkpoint
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          if git diff --cached --quiet; then
            echo 'Verified checkpoint already matches.'
          else
            git commit -m 'Repair and verify localized checkpoint [skip ci]'
            git push origin "HEAD:${branch}"
          fi
