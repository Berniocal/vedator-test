name: One-time sync from vedator

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Berniocal/vedator
          ref: main
          path: source

      - name: Replace target with current vedator main
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Target already matches source.'
            exit 0
          fi
          git commit -m 'Sync from Berniocal/vedator main'
          git push origin HEAD:main
