name: Extract i18n inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proper-i18n
          fetch-depth: 1
      - name: Checkout original application
        run: git clone --depth 1 https://github.com/Berniocal/vedator.git .source-vedator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract explicit localization inventory
        run: python tools/extract_i18n.py .source-vedator
      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .source-vedator
          git add i18n-inventory source-manifest.json
          git commit -m 'Extract explicit localization inventory' || exit 0
          git push origin HEAD:proper-i18n
