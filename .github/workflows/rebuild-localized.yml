name: Rebuild exact localized copies

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: vedator-localized-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Ignore temporary build files
        run: printf '/.source-vedator/\n__pycache__/\n*.py[cod]\n' >> .git/info/exclude

      - name: Checkout original application
        run: git clone --depth 1 https://github.com/Berniocal/vedator.git .source-vedator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-200-distilled-600m-v1

      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.46,<5' sentencepiece beautifulsoup4

      - name: Validate source and generators
        run: |
          python -m py_compile tools/build_localized.py tools/build_fast.py tools/build_safe.py tools/validate_source.py tools/validate_build.py tools/validate_build_fixed.py
          python tools/validate_source.py .source-vedator

      - name: Build both languages safely
        run: VEDATOR_LANGS=sk,cs python tools/build_safe.py

      - name: Remove superseded prototype files
        run: |
          rm -f app.js core.js views.js player.js playlists.js styles.css
          rm -rf locales content

      - name: Record source commit
        run: git -C .source-vedator rev-parse HEAD > .generated-source-sha

      - name: Validate complete generated application
        run: python tools/validate_build_fixed.py .source-vedator sk cs

      - name: Preserve verified build
        uses: actions/upload-artifact@v4
        with:
          name: vedator-localized-verified-${{ github.run_id }}
          path: |
            sk
            cs
            translations/memory.json
            index.html
            sw.js
            manifest.webmanifest
            icon.svg
            .generated-source-sha
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified build
        run: |
          branch="${GITHUB_REF_NAME}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build verified Czech and Slovak copies [skip ci]'
            git push origin "HEAD:${branch}"
          fi
