name: Obnova titulků 2. dílu z audia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-episode2-subtitles.yml'

permissions:
  contents: write

concurrency:
  group: recover-episode-2-subtitles
  cancel-in-progress: false

jobs:
  recognize-and-align:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Načíst vedator-test
        uses: actions/checkout@v4

      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Nainstalovat nástroj pro rozpoznání slovenské řeči
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1

      - name: Stáhnout původní podcast a obnovit titulky podle zvuku
        env:
          WHISPER_MODEL: medium
        run: python tools/rebuild-episode2-subtitles.py

      - name: Ověřit strukturu SRT
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          srt=Path('titulky/vedatorsky-podcast-2-temna-hmota.sk.srt').read_text(encoding='utf-8')
          cues=re.findall(r'^\\d+\\n\\d{2}:\\d{2}:\\d{2},\\d{3} --> \\d{2}:\\d{2}:\\d{2},\\d{3}',srt,re.M)
          assert len(cues)>=140, f'Insufficient cue count: {len(cues)}'
          print('Validated',len(cues),'subtitle cues.')
          PY

      - name: Uložit opravený návrh a kontrolní report do GitHubu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- titulky/vedatorsky-podcast-2-temna-hmota.original.srt titulky/vedatorsky-podcast-2-temna-hmota.sk.srt titulky/vedatorsky-podcast-2-temna-hmota.review.json
          if git diff --cached --quiet; then
            echo 'Žádné změny titulků.'
          else
            git commit -m 'Obnovit slovenské titulky epizody 2 podle audia'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
