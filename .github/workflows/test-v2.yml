name: Test Vedator V2 prototype

on:
  push:
    branches:
      - v2/content-and-tabs
      - v2/user-data-player-playlists
      - v2/language-translations
      - v2/questions-nonquestions-deeplinks
      - v2/episode-cards-and-series-progress
      - v2/ui-polish-dark-mobile
      - v2/full-parity-audit
      - v2/mobile-deep-polish
      - v2/final-ui-faq-guide
    paths:
      - 'tools/**'
      - 'app-v2.js'
      - 'v2.html'
      - 'manifest-v2.webmanifest'
      - 'V2-MAINTENANCE.md'
      - '.github/workflows/test-v2.yml'
      - '.github/workflows/update-podcast-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build one content bundle
        run: |
          node tools/build-content-v2.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-parity-content.mjs

      - name: Build V2 experiences into app-v2
        run: |
          node tools/patch-v2-question-experience.mjs
          node tools/patch-v2-episode-experience.mjs
          node tools/patch-v2-ui-experience.mjs
          node tools/patch-v2-tests.mjs
          node tools/patch-v2-full-parity.mjs
          node tools/finalize-v2-full-parity.mjs
          node tools/patch-v2-playlist-parity.mjs
          node tools/finalize-v2-playlist-parity.mjs
          node tools/patch-v2-mobile-deep-polish-v2.mjs
          node tools/finalize-v2-mobile-deep-polish.mjs
          node tools/finalize-v2-mobile-contrast.mjs
          node tools/finalize-v2-mobile-width.mjs
          node tools/finalize-v2-episode-context-order.mjs
          node tools/finalize-v2-final-ui-faq-guide.mjs
          node tools/fix-v2-final-ui-runtime.mjs
          node tools/fix-v2-series-three-column-mobile.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app-v2.js
          node --check tools/build-content-v2.mjs
          node --check tools/augment-v2-episode-descriptions.mjs
          node --check tools/augment-v2-parity-content.mjs
          node --check tools/patch-v2-question-experience.mjs
          node --check tools/patch-v2-episode-experience.mjs
          node --check tools/patch-v2-ui-experience.mjs
          node --check tools/patch-v2-tests.mjs
          node --check tools/patch-v2-full-parity.mjs
          node --check tools/finalize-v2-full-parity.mjs
          node --check tools/patch-v2-playlist-parity.mjs
          node --check tools/finalize-v2-playlist-parity.mjs
          node --check tools/patch-v2-mobile-deep-polish-v2.mjs
          node --check tools/finalize-v2-mobile-deep-polish.mjs
          node --check tools/finalize-v2-mobile-contrast.mjs
          node --check tools/finalize-v2-mobile-width.mjs
          node --check tools/finalize-v2-episode-context-order.mjs
          node --check tools/finalize-v2-final-ui-faq-guide.mjs
          node --check tools/fix-v2-final-ui-runtime.mjs
          node --check tools/fix-v2-series-three-column-mobile.mjs
          node --check tools/test-content-v2.mjs
          node --check tools/test-v2-faq-integrity.mjs
          node --check tools/test-app-v2.mjs
          node --check tools/test-v2-question-experience.mjs
          node --check tools/test-v2-episode-experience.mjs
          node --check tools/test-v2-ui-experience.mjs
          node --check tools/test-v2-full-parity.mjs
          node --check tools/test-v2-playlist-parity.mjs
          node --check tools/test-v2-mobile-deep-polish.mjs
          node --check tools/test-v2-episode-context-order.mjs
          node --check tools/test-v2-mobile-browser.mjs
          node --check tools/test-v2-mobile-browser-playlist.mjs
          node --check tools/test-v2-final-ui-faq-guide.mjs

      - name: Test content integrity
        run: node tools/test-content-v2.mjs

      - name: Test FAQ series and questions integrity
        run: node tools/test-v2-faq-integrity.mjs

      - name: Install DOM and browser test dependencies
        run: npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24

      - name: Test all V2 tabs in DOM
        run: node tools/test-app-v2.mjs

      - name: Test question experience and deep links
        run: node tools/test-v2-question-experience.mjs

      - name: Test episode cards and series progress
        run: node tools/test-v2-episode-experience.mjs

      - name: Test dark mode and mobile UI
        run: node tools/test-v2-ui-experience.mjs

      - name: Test full legacy parity
        run: node tools/test-v2-full-parity.mjs

      - name: Test playlist collection and mobile editor parity
        run: node tools/test-v2-playlist-parity.mjs

      - name: Test deep mobile polish and MP3 download
        run: node tools/test-v2-mobile-deep-polish.mjs

      - name: Test numeric episode player navigation
        run: node tools/test-v2-episode-context-order.mjs

      - name: Test final V2 UI and offline progress
        run: node tools/test-v2-final-ui-faq-guide.mjs

      - name: Test real 390px Chromium layout
        run: node tools/test-v2-mobile-browser.mjs

      - name: Test real 390px playlist editor
        run: node tools/test-v2-mobile-browser-playlist.mjs

      - name: Upload mobile Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-mobile-browser-screenshots
          path: mobile-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit generated V2 runtime
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content-v2.json app-v2.js v2.html tools/test-app-v2.mjs
          if git diff --cached --quiet; then
            echo 'Generated V2 runtime is unchanged.'
          else
            git commit -m 'Build V2 final UI runtime'
            git push origin HEAD:${{ github.ref_name }}
          fi
