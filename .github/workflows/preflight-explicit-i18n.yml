name: Preflight explicit i18n architecture

on:
  pull_request:
    branches: [main]
    paths:
      - tools/build_explicit_i18n.py
      - tools/validate_explicit_i18n.py
      - tools/generate_explicit_locales*.py
      - locales/manual-overrides.json
      - .github/workflows/preflight-explicit-i18n.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout original application
        run: git clone --depth 1 https://github.com/Berniocal/vedator.git .source-vedator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight parser
        run: python -m pip install beautifulsoup4
      - name: Compile every localization script
        run: python -m py_compile tools/generate_explicit_locales.py tools/generate_explicit_locales_v2.py tools/generate_explicit_locales_v3.py tools/generate_explicit_locales_v4.py tools/build_explicit_i18n.py tools/validate_explicit_i18n.py
      - name: Create temporary explicit data without translating code
        run: |
          mkdir -p locales
          cp .source-vedator/episodes.json locales/episodes.cs.json
          cp .source-vedator/episodes.json locales/episodes.sk.json
          test -f locales/strings.cs.json || printf '{}\n' > locales/strings.cs.json
          test -f locales/strings.sk.json || printf '{}\n' > locales/strings.sk.json
      - name: Build from explicit data
        run: python tools/build_explicit_i18n.py .source-vedator
      - name: Validate design, syntax, references and protected technical strings
        run: python tools/validate_explicit_i18n.py .source-vedator
