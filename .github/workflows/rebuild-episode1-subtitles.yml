name: Obnova slovenských titulků 1. dílu z MP3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-episode1-subtitles.yml'
permissions:
  contents: write
concurrency:
  group: recover-episode-1-subtitles
  cancel-in-progress: false
jobs:
  recognize-and-align:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Načíst vedator-test
        uses: actions/checkout@v4
      - name: Připravit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nainstalovat přepis slovenské řeči
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Stáhnout podcast a přepsat 1. díl s procenty průběhu
        env:
          WHISPER_MODEL: medium
        run: python tools/rebuild-episode1-subtitles.py
      - name: Ověřit úplnost titulků
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('titulky/vedatorsky-podcast-1-jaderna-energie-v-dobe-klimatickych-zmen.sk.srt').read_text(encoding='utf8')
          blocks=re.findall(r'^\d+\n\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}',text,re.M)
          assert len(blocks)>=170, f'Only {len(blocks)} subtitles'
          print('OK:',len(blocks),'subtitles')
          PY
      - name: Uložit opravené SK titulky a kontrolní report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- titulky/vedatorsky-podcast-1-jaderna-energie-v-dobe-klimatickych-zmen.original.srt titulky/vedatorsky-podcast-1-jaderna-energie-v-dobe-klimatickych-zmen.sk.srt titulky/vedatorsky-podcast-1-jaderna-energie-v-dobe-klimatickych-zmen.review.json
          if git diff --cached --quiet; then
            echo 'Titulkům se nic nezměnilo.'
          else
            git commit -m 'Obnovit slovenské titulky 1. dílu podle MP3'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
